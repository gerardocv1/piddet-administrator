<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#e77001" />
    <!-- La barra de estado de la app instalada se funde con el fondo de la app: este valor es
         --bg-body y se reajusta al cambiar de tema (ver applyThemeColor en App.jsx). Cualquier
         diferencia con el fondo se ve como una línea de corte bajo la hora. -->
    <meta name="theme-color" content="#fbfbfc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- NO poner `black-translucent` aquí. Es tentador porque hace que la app pinte bajo la barra
         de estado, pero en la app instalada deja el viewport de maquetación ~47 px más corto que
         la pantalla: el dock, que va fijo a `bottom: 0`, queda anclado por encima del borde real
         y debajo asoma una franja de --bg-body. Medido en un iPhone 12/13/14 (390x844): el último
         texto del dock caía en 752 px y quedaban 91 px en blanco, cuando lo correcto son ~37
         (34 del indicador de inicio + el padding propio).
         Con `default` la app sigue siendo pantalla completa —standalone, sin barra del
         navegador—, la barra de estado la dibuja el sistema y el viewport coincide con la
         pantalla. Los env(safe-area-inset-*) siguen haciendo falta: arriba valen 0 en la app
         instalada, pero no en Safari con notch, y abajo cubren el indicador de inicio. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Piddet" />
    <meta name="application-name" content="Piddet" />
    <title>Piddet · Panel de administración</title>
    <!-- Fuentes e iconos con carga asíncrona (media=print + swap en onload): si un CDN tarda o
         falla, la app arranca igual con los fallbacks, en vez de bloquear el primer render y la
         ejecución del script. Los @import de Google Fonts salieron de tokens.css por lo mismo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap"
      media="print" onload="this.media='all'" />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap"
      media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" />
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    </noscript>
    <!--
      IDENTIDAD INSTALABLE. Va aquí en línea, y no en el bundle, por una razón medida:

      Safari toma el nombre de «Agregar a Inicio» del WEB APP MANIFEST y lo fija al cargar el
      documento. Cambiar después `apple-mobile-web-app-title` o el href del link no le llega: en
      un iPhone seguía saliendo el `short_name` del manifest estático («Piddet») aunque el script
      ya hubiera reescrito la meta. Por eso arriba NO hay <link rel="manifest">: lo inserta este
      script, de modo que el primer y único manifest que el navegador llega a ver es el de la
      compañía. Chrome gana lo mismo, porque congela el diálogo de instalación más tarde, en
      `beforeinstallprompt`.

      Un módulo (main.jsx) va diferido y llegaría tarde; de ahí el script clásico durante el
      parseo. Expone `window.__piddetPwa` para que applyCompanyPwa.js reaplique lo mismo al
      cambiar de compañía o guardar el perfil, sin duplicar la lógica.
    -->
    <script>
      (function () {
        var API = '%VITE_API_URL%';
        if (API.charAt(0) === '%') API = ''; // build sin backend: rigen los iconos de Piddet
        var ADMIN = '/admin';
        var SPLASH = '#fbfbfc';        // igual que --bg-body: la barra de estado se funde con él
        var SHORT_MAX = 12;            // lo que cabe bajo el icono en la pantalla de inicio
        var DEFAULT_TITLE = document.title;
        var blobUrl = null;

        function linkEl(rel) {
          var found = document.querySelector('link[rel="' + rel + '"]');
          if (found) return found;
          var el = document.createElement('link');
          el.rel = rel;
          document.head.appendChild(el);
          return el;
        }

        function setMeta(name, value) {
          var tag = document.querySelector('meta[name="' + name + '"]');
          if (tag) tag.setAttribute('content', value);
        }

        /** El nombre configurado en el perfil; si no hay, el comercial. */
        function appNameOf(company) {
          return (company.app_name || '').trim() || (company.name || '').trim();
        }

        /** Icono servido por el backend. El `v` cuelga de logo y fondo: cambiarlos estrena URL. */
        function iconUrl(company, size, maskable) {
          if (!API || !company.username) return null;
          var version = ((company.icon || '') + (company.app_icon_bg || company.brand_primary || ''))
            .replace(/\W/g, '').slice(-12);
          return API + '/public/' + encodeURIComponent(company.username)
            + '/app-icon-' + size + '.png?' + (maskable ? 'maskable=1&' : '')
            + 'v=' + encodeURIComponent(version);
        }

        function iconsFor(company, origin) {
          var own = iconUrl(company, 192, false);
          if (!own) {
            return [
              { src: origin + '/favicon/android-chrome-192x192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
              { src: origin + '/favicon/android-chrome-512x512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
              { src: origin + '/favicon/maskable-512x512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
            ];
          }
          return [
            { src: own, sizes: '192x192', type: 'image/png', purpose: 'any' },
            { src: iconUrl(company, 512, false), sizes: '512x512', type: 'image/png', purpose: 'any' },
            { src: iconUrl(company, 512, true), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
          ];
        }

        function shortName(name) {
          if (name.length <= SHORT_MAX) return name;
          var cut = name.slice(0, SHORT_MAX);
          var space = cut.lastIndexOf(' ');
          return (space > 4 ? cut.slice(0, space) : cut).replace(/\s+$/, '');
        }

        function apply(company) {
          if (!company || !appNameOf(company)) return restore();

          var name = appNameOf(company);
          var origin = window.location.origin;
          var manifest = {
            id: origin + ADMIN + '/',
            name: name,
            short_name: shortName(name),
            description: 'Panel de administración de ' + name + ' en Piddet.',
            lang: 'es',
            dir: 'ltr',
            // El manifest vive en un blob: sin URL base, sus rutas deben ser absolutas.
            start_url: origin + ADMIN + '/',
            scope: origin + ADMIN + '/',
            display: 'standalone',
            display_override: ['standalone', 'minimal-ui'],
            orientation: 'any',
            background_color: SPLASH,
            theme_color: SPLASH,
            icons: iconsFor(company, origin)
          };

          if (blobUrl) URL.revokeObjectURL(blobUrl);
          blobUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));

          linkEl('manifest').href = blobUrl;
          // iOS redondea él las esquinas, así que se le pide el lienzo completo (maskable).
          linkEl('apple-touch-icon').href = iconUrl(company, 180, true) || '/favicon/apple-touch-icon.png';
          setMeta('apple-mobile-web-app-title', name);
          setMeta('application-name', name);
          document.title = name + ' · Panel de administración';
        }

        function restore() {
          if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
          linkEl('manifest').href = '/manifest.webmanifest';
          linkEl('apple-touch-icon').href = '/favicon/apple-touch-icon.png';
          setMeta('apple-mobile-web-app-title', 'Piddet');
          setMeta('application-name', 'Piddet');
          document.title = DEFAULT_TITLE;
        }

        function storedCompany() {
          try {
            var store = localStorage.getItem('piddet_persist') === '1' ? localStorage : sessionStorage;
            return JSON.parse(store.getItem('piddet_company') || 'null');
          } catch (e) {
            return null; // storage bloqueado o modo privado
          }
        }

        window.__piddetPwa = { apply: apply, restore: restore };

        // Solo el panel: las páginas públicas (carta, portada, check-in) comparten documento pero
        // no son la app instalable, y además fijan su propio título para compartir.
        var path = window.location.pathname;
        var inPanel = path === '/' || path === ADMIN || path.indexOf(ADMIN + '/') === 0;
        try {
          apply(inPanel ? storedCompany() : null);
        } catch (e) {
          restore(); // pase lo que pase, el documento queda con un manifest válido
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

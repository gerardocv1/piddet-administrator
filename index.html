<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#e77001" />
    <!-- La barra de estado de la app instalada se funde con el fondo de la app: este valor es
         --bg-body y se reajusta al cambiar de tema (ver applyThemeColor en App.jsx). Cualquier
         diferencia con el fondo se ve como una línea de corte bajo la hora. -->
    <meta name="theme-color" content="#fbfbfc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: instalada en iOS la app pinta borde a borde (toda la pantalla, con la
         hora sobre el propio fondo). Activa los env(safe-area-inset-*) que el CSS ya reserva en
         topbar, dock, login y wizards; con "default" iOS meta una barra opaca del sistema. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Piddet" />
    <meta name="application-name" content="Piddet" />
    <title>Piddet · Panel de administración</title>
    <!-- Fuentes e iconos con carga asíncrona (media=print + swap en onload): si un CDN tarda o
         falla, la app arranca igual con los fallbacks, en vez de bloquear el primer render y la
         ejecución del script. Los @import de Google Fonts salieron de tokens.css por lo mismo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap"
      media="print" onload="this.media='all'" />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap"
      media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" />
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    </noscript>
    <!-- Identidad instalable de la compañía activa, lo ANTES posible. iOS fija el nombre y el
         icono de «Agregar a Inicio» al cargar el documento, antes de que corra el bundle, así que
         esto no puede esperar a main.jsx: va en línea y al final del <head>, cuando las metas de
         arriba ya existen. Repite a propósito la lectura de la sesión (src/lib/auth/storage.js)
         para no arrastrar el bundle hasta aquí; el resto lo reaplica applyCompanyPwa.js. -->
    <script>
      (function () {
        try {
          var persistent = localStorage.getItem('piddet_persist') === '1';
          var store = persistent ? localStorage : sessionStorage;
          var company = JSON.parse(store.getItem('piddet_company') || 'null');
          if (!company || !company.name) return;

          // El NOMBRE va primero y sin depender de nada más: es lo único que Safari no relee
          // después, y antes se quedaba sin poner cuando no había backend configurado.
          var appName = (company.app_name || '').trim() || company.name;
          // El título original queda anotado para que applyCompanyPwa.js pueda restaurarlo al
          // cerrar sesión: cuando ese módulo arranca, esta línea ya lo habrá cambiado.
          document.documentElement.dataset.defaultTitle = document.title;
          document.title = appName + ' · Panel de administración';
          ['apple-mobile-web-app-title', 'application-name'].forEach(function (name) {
            var tag = document.querySelector('meta[name="' + name + '"]');
            if (tag) tag.setAttribute('content', appName);
          });

          // El icono sí necesita el backend y el username; si falta cualquiera, queda el de Piddet.
          var api = '%VITE_API_URL%';
          if (!api || api.charAt(0) === '%' || !company.username) return;
          var icon = document.querySelector('link[rel="apple-touch-icon"]');
          if (icon) {
            var version = ((company.icon || '') + (company.app_icon_bg || company.brand_primary || ''))
              .replace(/\W/g, '').slice(-12);
            icon.href = api + '/public/' + encodeURIComponent(company.username)
              + '/app-icon-180.png?maskable=1&v=' + encodeURIComponent(version);
          }
        } catch (e) {
          /* sin sesión, sin storage o en modo privado: queda la identidad Piddet */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
